<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07090d">
    <title>Unit Status Command Board</title>

    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #07090d;
            color: #f1f5f9;
            font-synthesis: none;
        }

        * { box-sizing: border-box; }
        html, body { min-height: 100%; }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px),
                radial-gradient(circle at 50% -20%, rgba(71, 85, 105, 0.16), transparent 48rem),
                #07090d;
            background-size: 32px 32px, 32px 32px, auto, auto;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .dashboard {
            position: relative;
            width: 100%;
            min-height: 100vh;
            padding: clamp(10px, 1.3vw, 20px);
        }

        .unit-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-auto-rows: minmax(210px, 1fr);
            gap: clamp(9px, 1vw, 14px);
            min-height: calc(100vh - clamp(20px, 2.6vw, 40px));
        }

        .unit-card {
            --accent: #64748b;
            --accent-rgb: 100, 116, 139;
            position: relative;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 11px;
            background: rgba(11, 15, 22, 0.94);
            box-shadow: 0 12px 26px rgba(0, 0, 0, 0.26);
        }

        .unit-card::before {
            content: "";
            position: absolute;
            z-index: 2;
            inset: 0 auto 0 0;
            width: 5px;
            background: var(--accent);
            box-shadow: 0 0 22px rgba(var(--accent-rgb), 0.55);
        }

        .unit-card::after {
            content: "";
            position: absolute;
            pointer-events: none;
            inset: 0;
            border-top: 2px solid rgba(var(--accent-rgb), 0.55);
            opacity: 0.7;
        }

        .unit-card.status-oos { --accent: #fb4b5f; --accent-rgb: 251, 75, 95; }
        .unit-card.status-limited { --accent: #ffb020; --accent-rgb: 255, 176, 32; }
        .unit-card.status-in-service { --accent: #22c55e; --accent-rgb: 34, 197, 94; }

        .card-content {
            display: grid;
            grid-template-columns: minmax(180px, 0.78fr) minmax(0, 1.32fr);
            grid-template-rows: minmax(0, 1fr) auto;
            height: 100%;
            min-width: 0;
        }

        .card-top {
            grid-column: 1;
            grid-row: 1 / -1;
            display: flex;
            min-width: 0;
            flex-direction: column;
            align-items: flex-start;
            justify-content: space-between;
            gap: 18px;
            padding: clamp(18px, 1.65vw, 26px) clamp(16px, 1.45vw, 24px) clamp(16px, 1.4vw, 22px) clamp(21px, 1.7vw, 28px);
            border-right: 1px solid rgba(var(--accent-rgb), 0.22);
            background:
                linear-gradient(145deg, rgba(var(--accent-rgb), 0.13), transparent 70%),
                rgba(var(--accent-rgb), 0.035);
        }

        .unit-identity { min-width: 0; }

        .eyebrow, .field-label, .update-label {
            color: #79869a;
            font-size: 0.67rem;
            font-weight: 800;
            letter-spacing: 0.15em;
            line-height: 1;
            text-transform: uppercase;
        }

        .eyebrow { color: rgba(var(--accent-rgb), 0.95); }

        .unit-name {
            margin: 10px 0 0;
            color: #ffffff;
            font-family: "JetBrains Mono", ui-monospace, monospace;
            font-size: clamp(1.65rem, 2.35vw, 2.7rem);
            font-weight: 700;
            letter-spacing: -0.065em;
            line-height: 0.98;
            overflow-wrap: anywhere;
            text-shadow: 0 0 24px rgba(var(--accent-rgb), 0.12);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            max-width: 100%;
            padding: 8px 11px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 5px;
            background: rgba(100, 116, 139, 0.12);
            color: #cbd5e1;
            font-size: 0.69rem;
            font-weight: 800;
            letter-spacing: 0.09em;
            line-height: 1.15;
            text-transform: uppercase;
        }

        .status-badge::before {
            content: "";
            width: 7px;
            height: 7px;
            flex: 0 0 7px;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 10px currentColor;
        }

        .status-oos .status-badge {
            border-color: rgba(251, 75, 95, 0.36);
            background: rgba(251, 75, 95, 0.13);
            color: #ff8796;
        }

        .status-limited .status-badge {
            border-color: rgba(255, 176, 32, 0.34);
            background: rgba(255, 176, 32, 0.12);
            color: #ffc75f;
        }

        .status-in-service .status-badge {
            border-color: rgba(52, 211, 153, 0.28);
            background: rgba(52, 211, 153, 0.1);
            color: #6ee7b7;
        }

        .card-fields {
            grid-column: 2;
            grid-row: 1;
            display: grid;
            min-width: 0;
            align-content: start;
            gap: 13px;
            padding: clamp(17px, 1.45vw, 23px) clamp(17px, 1.55vw, 25px) 12px;
        }

        .field-heading { display: flex; align-items: center; gap: 7px; }
        .field-heading svg { width: 15px; height: 15px; color: #5e6b7f; stroke-width: 2; }

        .field-value {
            display: -webkit-box;
            margin: 7px 0 0;
            overflow: hidden;
            color: #edf2f7;
            font-size: clamp(0.98rem, 1.22vw, 1.2rem);
            font-weight: 700;
            line-height: 1.25;
            overflow-wrap: anywhere;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 1;
        }

        .remarks {
            min-width: 0;
            padding: 11px 13px 12px;
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-left: 2px solid rgba(var(--accent-rgb), 0.46);
            border-radius: 5px;
            background: rgba(148, 163, 184, 0.045);
        }

        .remarks .field-value {
            color: #aeb8c8;
            font-size: clamp(0.85rem, 1.02vw, 0.98rem);
            font-weight: 500;
            line-height: 1.35;
            -webkit-line-clamp: 2;
        }

        .field-value.is-empty { color: #536075; font-style: italic; font-weight: 500; }

        .card-update {
            grid-column: 2;
            grid-row: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px clamp(17px, 1.55vw, 25px) 13px;
            border-top: 1px solid rgba(148, 163, 184, 0.1);
        }

        .update-time {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #8592a6;
            font-family: "JetBrains Mono", ui-monospace, monospace;
            font-size: 0.74rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .update-time svg { width: 14px; height: 14px; }

        .state-panel {
            grid-column: 1 / -1;
            display: flex;
            min-height: calc(100vh - clamp(20px, 2.6vw, 40px));
            align-items: center;
            justify-content: center;
            padding: 32px;
            border: 1px dashed #293140;
            border-radius: 11px;
            background: rgba(11, 15, 22, 0.88);
            text-align: center;
        }

        .state-content { max-width: 520px; }

        .state-icon {
            display: inline-grid;
            width: 72px;
            height: 72px;
            place-items: center;
            margin-bottom: 20px;
            border: 1px solid #293140;
            border-radius: 9px;
            background: #10151e;
            color: #64748b;
        }

        .state-icon svg { width: 32px; height: 32px; }
        .state-title { margin: 0; color: #dce4ef; font-size: clamp(1.35rem, 2vw, 1.8rem); }
        .state-copy { margin: 10px 0 0; color: #718096; line-height: 1.6; }

        .loader-ring {
            width: 48px;
            height: 48px;
            margin: 0 auto 22px;
            border: 3px solid rgba(40, 197, 229, 0.17);
            border-top-color: #28c5e5;
            border-radius: 50%;
            animation: spin 0.85s linear infinite;
        }

        .overflow-note {
            position: fixed;
            right: clamp(10px, 1.3vw, 20px);
            bottom: clamp(10px, 1.3vw, 20px);
            z-index: 5;
            padding: 9px 13px;
            border: 1px solid #313b4b;
            border-radius: 5px;
            background: rgba(11, 15, 22, 0.96);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            color: #cbd5e1;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (min-width: 1600px) {
            .unit-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }

        @media (max-width: 759px) {
            .unit-grid { grid-template-columns: 1fr; grid-auto-rows: minmax(225px, auto); }
        }

        @media (max-width: 469px) {
            .card-content {
                grid-template-columns: minmax(135px, 0.72fr) minmax(0, 1.28fr);
            }

            .card-top { padding: 17px 13px 15px 18px; }
            .unit-name { font-size: clamp(1.35rem, 7.8vw, 1.75rem); }
            .status-badge { padding: 7px 8px; font-size: 0.6rem; }
            .card-fields { padding: 16px 14px 10px; }
            .card-update { padding: 9px 14px 12px; }
            .update-label { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
<body>
    <main class="dashboard" aria-live="polite">
        <section id="unit-grid" class="unit-grid" aria-label="Units requiring attention">
            <div class="state-panel">
                <div class="state-content">
                    <div class="loader-ring" aria-hidden="true"></div>
                    <p class="eyebrow">Establishing uplink</p>
                </div>
            </div>
        </section>
        <div id="overflow-note" class="overflow-note" hidden></div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, query, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCxer4UcW04LXNXZe3WdjTAi6C64P18VJE",
            authDomain: "spfld-twp-fire.firebaseapp.com",
            projectId: "spfld-twp-fire",
            storageBucket: "spfld-twp-fire.firebasestorage.app",
            messagingSenderId: "625097083856",
            appId: "1:625097083856:web:2703d29764be68eab6c7d5",
            measurementId: "G-5JDF2SZVGZ"
        };

        const MAX_VISIBLE_UNITS = 12;
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const grid = document.getElementById('unit-grid');
        const overflowNote = document.getElementById('overflow-note');

        function normalizeStatus(value) {
            const status = String(value || '').trim();
            if (status === 'OOS') return { label: 'OOS', className: 'status-oos', priority: 1 };
            if (status === 'Limited Service') return { label: 'Limited Service', className: 'status-limited', priority: 2 };
            if (status === 'In Service') return { label: 'In Service', className: 'status-in-service', priority: 3 };
            return { label: status || 'Unknown', className: 'status-unknown', priority: 4 };
        }

        function timestampToMillis(timestamp) {
            if (!timestamp) return 0;
            if (typeof timestamp.toMillis === 'function') return timestamp.toMillis();
            if (typeof timestamp.toDate === 'function') return timestamp.toDate().getTime();
            const milliseconds = new Date(timestamp).getTime();
            return Number.isFinite(milliseconds) ? milliseconds : 0;
        }

        function formatRelativeTime(milliseconds) {
            if (!milliseconds) return 'Never';
            const seconds = Math.max(0, Math.floor((Date.now() - milliseconds) / 1000));
            if (seconds < 60) return 'Just now';
            if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
            if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
            if (seconds < 604800) return `${Math.floor(seconds / 86400)}d ago`;
            return new Date(milliseconds).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        function formatAbsoluteTime(milliseconds) {
            if (!milliseconds) return 'No update time reported';
            return new Date(milliseconds).toLocaleString('en-US', {
                month: 'short', day: 'numeric', year: 'numeric',
                hour: 'numeric', minute: '2-digit'
            });
        }

        function createIcon(name) {
            const icon = document.createElement('i');
            icon.dataset.lucide = name;
            icon.setAttribute('aria-hidden', 'true');
            return icon;
        }

        function createField(iconName, label, value, emptyText, extraClass = '') {
            const field = document.createElement('div');
            if (extraClass) field.className = extraClass;
            const heading = document.createElement('div');
            heading.className = 'field-heading';
            heading.append(createIcon(iconName));
            const labelElement = document.createElement('span');
            labelElement.className = 'field-label';
            labelElement.textContent = label;
            heading.append(labelElement);

            const text = String(value || '').trim();
            const valueElement = document.createElement('p');
            valueElement.className = `field-value${text ? '' : ' is-empty'}`;
            valueElement.textContent = text || emptyText;
            valueElement.title = text || emptyText;
            field.append(heading, valueElement);
            return field;
        }

        function createUnitCard(item) {
            const status = normalizeStatus(item.status);
            const milliseconds = timestampToMillis(item.reported);
            const card = document.createElement('article');
            card.className = `unit-card ${status.className}`;
            card.dataset.updatedAt = String(milliseconds);

            const content = document.createElement('div');
            content.className = 'card-content';
            const top = document.createElement('div');
            top.className = 'card-top';
            const identity = document.createElement('div');
            identity.className = 'unit-identity';
            const eyebrow = document.createElement('span');
            eyebrow.className = 'eyebrow';
            eyebrow.textContent = 'Unit';
            const name = document.createElement('h2');
            name.className = 'unit-name';
            name.textContent = String(item.unit || '').trim() || '---';
            name.title = name.textContent;
            identity.append(eyebrow, name);

            const badge = document.createElement('span');
            badge.className = 'status-badge';
            badge.textContent = status.label;
            top.append(identity, badge);

            const fields = document.createElement('div');
            fields.className = 'card-fields';
            fields.append(
                createField('map-pin', 'Location', item.location, 'Not reported'),
                createField('message-square', 'Remarks', item.comments, 'No active remarks.', 'remarks')
            );

            const update = document.createElement('div');
            update.className = 'card-update';
            const updateLabel = document.createElement('span');
            updateLabel.className = 'update-label';
            updateLabel.textContent = 'Updated';
            const updateTime = document.createElement('time');
            updateTime.className = 'update-time';
            updateTime.title = formatAbsoluteTime(milliseconds);
            if (milliseconds) updateTime.dateTime = new Date(milliseconds).toISOString();
            updateTime.append(createIcon('clock-3'));
            const relativeTime = document.createElement('span');
            relativeTime.className = 'relative-time';
            relativeTime.textContent = formatRelativeTime(milliseconds);
            updateTime.append(relativeTime);
            update.append(updateLabel, updateTime);

            content.append(top, fields, update);
            card.append(content);
            return card;
        }

        function renderState(iconName, title, copy) {
            grid.replaceChildren();
            overflowNote.hidden = true;
            const panel = document.createElement('div');
            panel.className = 'state-panel';
            const content = document.createElement('div');
            content.className = 'state-content';
            const iconWrap = document.createElement('div');
            iconWrap.className = 'state-icon';
            iconWrap.append(createIcon(iconName));
            const heading = document.createElement('h2');
            heading.className = 'state-title';
            heading.textContent = title;
            const paragraph = document.createElement('p');
            paragraph.className = 'state-copy';
            paragraph.textContent = copy;
            content.append(iconWrap, heading, paragraph);
            panel.append(content);
            grid.append(panel);
            lucide.createIcons();
        }

        function displayData(records) {
            const applicableUnits = (records || [])
                .filter(item => {
                    const status = String(item.status || '').trim();
                    const hasRemarks = String(item.comments || '').trim().length > 0;
                    return status === 'OOS' || status === 'Limited Service' || hasRemarks;
                })
                .sort((a, b) => {
                    const priorityDifference = normalizeStatus(a.status).priority - normalizeStatus(b.status).priority;
                    return priorityDifference || timestampToMillis(b.reported) - timestampToMillis(a.reported);
                });

            if (applicableUnits.length === 0) {
                renderState('circle-check-big', 'All clear', 'No out-of-service, limited-service, or remarked units are currently reporting.');
                return;
            }

            const visibleUnits = applicableUnits.slice(0, MAX_VISIBLE_UNITS);
            grid.replaceChildren(...visibleUnits.map(createUnitCard));
            const hiddenCount = applicableUnits.length - visibleUnits.length;
            overflowNote.hidden = hiddenCount === 0;
            overflowNote.textContent = hiddenCount ? `+${hiddenCount} additional unit${hiddenCount === 1 ? '' : 's'}` : '';
            lucide.createIcons();
        }

        function refreshRelativeTimes() {
            document.querySelectorAll('.unit-card').forEach(card => {
                const milliseconds = Number(card.dataset.updatedAt) || 0;
                const relativeTime = card.querySelector('.relative-time');
                if (relativeTime) relativeTime.textContent = formatRelativeTime(milliseconds);
            });
        }

        async function loadData() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                const unitStatusQuery = query(collection(db, 'unitStatus'));
                onSnapshot(unitStatusQuery, snapshot => {
                    displayData(snapshot.docs.map(document => document.data()));
                }, error => {
                    console.error('Unit status stream error', error);
                    renderState('wifi-off', 'Connection interrupted', 'Live unit data is temporarily unavailable. The board will recover automatically when the connection returns.');
                });
            } catch (error) {
                console.error('Unit status initialization error', error);
                renderState('triangle-alert', 'Unable to load unit status', 'The board could not connect to the data service. Check the connection and reload the page.');
            }
        }

        setInterval(refreshRelativeTimes, 30_000);
        loadData();
    </script>
</body>
</html>
