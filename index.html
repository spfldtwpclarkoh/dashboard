  <style>
    .feed-item { opacity: 0; transform: translateY(2rem); transition: opacity 0.8s cubic-bezier(0.25, 0.8, 0.25, 1), transform 0.8s cubic-bezier(0.25, 0.8, 0.25, 1); }
    .feed-item.active { opacity: 1; transform: translateY(0); }
    .feed-item.fading-out { opacity: 0; transform: translateY(-2rem); }
    @keyframes marquee { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
    .animate-marquee { animation: marquee 20s linear infinite; }
    .ticker-hidden { display: none; }
    .ticker-visible { display: flex; }

    /* Keep the seasonal treatment scoped to the sidebar and behind live content. */
    .halloween-sidebar {
      position: relative;
      isolation: isolate;
      overflow-y: auto;
      gap: 16px;
      border-right: 1px solid #ad602f;
      background: radial-gradient(ellipse at 0 0, #713d294d, transparent 48%),
                  radial-gradient(ellipse at 100% 80%, #56336b40, transparent 55%), #18121f;
      box-shadow: 5px 0 24px #0005, inset -3px 0 #f2933826;
    }
    .halloween-sidebar > :not(.sidebar-cobweb) { position: relative; z-index: 1; }
    .sidebar-cobweb { position: absolute; top: 0; width: 108px; height: 108px; color: #c6b7d2; opacity: .2; pointer-events: none; z-index: 0; }
    .sidebar-cobweb-left { left: 0; }
    .sidebar-cobweb-right { right: 0; transform: scaleX(-1); }
    .sidebar-brand { width: 100%; gap: 16px; }
    .halloween-sidebar #dashboard-logo { width: min(100%, 192px); filter: drop-shadow(0 5px 14px #0006); }
    .sidebar-season { display: flex; align-items: center; justify-content: center; gap: 8px; color: #ffb46d; font-size: 11px; font-weight: 700; letter-spacing: .16em; white-space: nowrap; }
    .sidebar-season svg { width: 22px; height: 15px; flex-shrink: 0; color: #a994bb; }
    .halloween-sidebar #toolbar-weather-widget {
      width: 100%;
      padding: 22px 10px;
      border: 1px solid #b77d493d;
      border-radius: 18px;
      background: linear-gradient(145deg, #ffb46d0c, #9d72ba09);
      box-shadow: 0 8px 24px #0002;
    }
    .halloween-sidebar #weather-temp { color: #fff4e6; text-shadow: 0 0 28px #ff98232b; }
    .halloween-sidebar #weather-condition { color: #e5dbe9; }
    .halloween-sidebar #weather-location { color: #ffc18a; }
    .halloween-sidebar #weather-high-low { color: #c1b4ca; margin-top: 6px; }
    .halloween-sidebar #sidebar-alert-display { flex-shrink: 0; }
    .halloween-sidebar #clock-container { margin: 0; padding-top: 18px; border-top: 1px solid #b77d494d; }
    .sidebar-pumpkin { width: 64px; height: 48px; margin-bottom: 12px; flex-shrink: 0; filter: drop-shadow(0 0 12px #ef82232b); }
    .halloween-sidebar #local-time { max-width: 100%; font-size: clamp(28px, 2.5vw, 42px); letter-spacing: .015em; font-variant-numeric: tabular-nums; color: #fff4e6; }
    .halloween-sidebar #local-date { color: #d3c1de; }
    .halloween-sidebar #system-status { flex-shrink: 0; }
    .halloween-sidebar .sidebar-version {
      position: absolute;
      bottom: 2px;
      left: 0;
      right: 0;
      color: #b9a7c4;
      font-size: 10px;
      line-height: 10px;
      letter-spacing: .08em;
      text-align: center;
      pointer-events: none;
    }
    @media (min-width: 768px) and (max-height: 800px) {
      .halloween-sidebar { gap: 10px; padding: 16px 20px; }
      .halloween-sidebar #dashboard-logo { width: 112px; }
      .sidebar-brand { gap: 10px; }
      .halloween-sidebar #toolbar-weather-widget { padding: 12px 8px; }
      .halloween-sidebar #weather-icon-container { width: 48px; height: 48px; margin-bottom: 4px; }
      .halloween-sidebar #weather-icon-container svg { max-width: 100%; max-height: 100%; }
      .halloween-sidebar #weather-temp { font-size: 44px; }
      .halloween-sidebar #weather-condition { font-size: 18px; }
      .halloween-sidebar #weather-location { font-size: 16px; }
      .halloween-sidebar #weather-high-low { font-size: 14px; }
      .sidebar-pumpkin { width: 36px; height: 27px; margin-bottom: 6px; }
      .halloween-sidebar #clock-container { padding-top: 10px; }
      .halloween-sidebar #local-date { font-size: 16px; }
    }
    @media (min-width: 768px) and (max-height: 680px) {
      .halloween-sidebar { gap: 8px; padding: 12px 20px; }
      .halloween-sidebar #dashboard-logo { width: 76px; }
      .sidebar-brand { gap: 6px; }
      .sidebar-season { font-size: 9px; }
      .halloween-sidebar #toolbar-weather-widget { padding: 8px; flex-shrink: 0; }
      .halloween-sidebar #weather-icon-container { width: 40px; height: 40px; float: left; margin: 0 4px 0 0; }
      .halloween-sidebar #weather-temp { font-size: 40px; line-height: 1; }
      .halloween-sidebar #weather-condition, .halloween-sidebar #weather-location { font-size: 16px; line-height: 1.25; margin-top: 4px; }
      .halloween-sidebar #weather-high-low { line-height: 20px; margin-top: 4px; }
      .sidebar-pumpkin { display: none; }
      .halloween-sidebar #clock-container { padding-top: 8px; }
      .halloween-sidebar #local-time { font-size: 32px; line-height: 1.2; }
      .halloween-sidebar #local-date { font-size: 14px; line-height: 20px; padding-bottom: 0; }
    }
    @media (max-width: 767px) {
      .halloween-sidebar { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px 16px; padding: 14px 16px; border-right: 0; border-bottom: 1px solid #ad602f; }
      .sidebar-brand { grid-row: span 2; gap: 10px; }
      .sidebar-season { font-size: 9px; letter-spacing: .08em; white-space: normal; }
      .sidebar-season svg { display: none; }
      .halloween-sidebar #toolbar-weather-widget { padding: 8px; }
      .halloween-sidebar #weather-icon-container { width: 36px; height: 36px; float: left; margin: 4px 6px 0 0; }
      .halloween-sidebar #weather-temp { font-size: 32px; }
      .halloween-sidebar #weather-condition { font-size: 14px; margin-top: 2px; }
      .halloween-sidebar #weather-location { font-size: 13px; margin-top: 2px; }
      .halloween-sidebar #weather-high-low { font-size: 12px; margin-top: 2px; }
      .halloween-sidebar #clock-container { grid-column: 2; padding-top: 6px; }
      .halloween-sidebar #local-time { font-size: 26px; }
      .halloween-sidebar #local-date { font-size: 12px; padding-bottom: 0; }
      .sidebar-pumpkin { display: none; }
      .halloween-sidebar #sidebar-alert-display, .halloween-sidebar #system-status { grid-column: 1 / -1; }
      .halloween-sidebar #sidebar-alert-display { grid-row: 3; margin: 0; }
    }
  </style>
</head>

  <script type="module">
    const { initializeApp, getFirestore, doc, onSnapshot, collection, query, orderBy } = window.STFDFirebase;
    const { escapeHtml, finiteNumber, isFreshEvent, safeHttpsUrl, safeIframeMarkup } = window.STFDSafe;
 
    document.addEventListener('DOMContentLoaded', async () => {
        const statusElement = document.getElementById('system-status');
        const setSystemStatus = (message = '') => {
            statusElement.textContent = message;
            statusElement.classList.toggle('hidden', !message);
        };
        window.addEventListener('offline', () => setSystemStatus('Network offline — showing the last loaded content'));
        window.addEventListener('online', () => setSystemStatus(''));
        document.getElementById('dashboard-logo').addEventListener('error', (event) => {
            event.currentTarget.src = 'assets/STFD Logo 244x244.png';
        }, { once: true });
        
        // --- NATIVE LOCAL CLOCK ---
        function updateLocalClock() {
            if (typeof dayjs === 'undefined') return;
            const now = dayjs();
            document.getElementById('local-time').textContent = now.format('HH:mm:ss');
            document.getElementById('local-date').textContent = now.format('dddd, MMMM D');
        }
        setInterval(updateLocalClock, 1000);
        updateLocalClock();

        const firebaseConfig = {
          apiKey: "AIzaSyCxer4UcW04LXNXZe3WdjTAi6C64P18VJE",
          authDomain: "spfld-twp-fire.firebaseapp.com",
          projectId: "spfld-twp-fire",
          storageBucket: "spfld-twp-fire.firebasestorage.app",
          messagingSenderId: "625097083856",
          appId: "1:625097083856:web:2703d29764be68eab6c7d5",
          measurementId: "G-5JDF2SZVGZ"
        };

        let db; 
        let dashboardConfig = null; 
        let slideSources = []; 
        const shownAlerts = new Set();
        
        let ipawsInterval = null;
        let weatherInterval = null;
        let slidesRefreshInterval = null;
        let slideRotationTimer = null;
        let tickerInterval = null; 

        const slideDivs = document.querySelectorAll('.slide');
        let contentIndex = 0;
        let activeSlideIndex = 0;
        
        const googleSlideSource = { type: 'googleslides', iframe: ``, duration: 20000, order: 1 };
        
        const newsFeedSlideSource = {
            type: 'newsfeed',
            iframe: `<div id="feed-container" class="relative w-full h-full overflow-hidden bg-gradient-to-br from-gray-900 to-gray-800 text-white font-sans">
                        <div id="feed-track" class="absolute top-0 left-0 w-full h-full"></div>
                     </div>`,
            duration: 60000, 
            order: 2 
        };

        let newsFeedPosts = []; 
        let newsFeedSlideInterval = null; 
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR9IAuVH2-XwNFaqjm3UJEvQJNmnYePYSR9VAKqeHXHCaiMmhZfqX1LBPTiPTrIZ1Y8NgT-JQVR8w-z/pub?gid=0&single=true&output=csv';
        const REFRESH_INTERVAL_MS = 600000; 

        function initializeTicker() {
            const tickerRef = collection(db, 'ticker');
            
            onSnapshot(tickerRef, (snapshot) => {
                const allMessages = [];
                snapshot.forEach(doc => { allMessages.push(doc.data()); });
                
                const checkTicker = () => {
                    if (typeof dayjs === 'undefined') return;
                    const now = dayjs();
                    
                    const activeMessages = allMessages.filter(msg => {
                        const start = dayjs(msg.startDateTime);
                        const end = dayjs(msg.endDateTime);
                        return start.isValid() && end.isValid() && now.isAfter(start) && now.isBefore(end);
                    }).map(msg => msg.message);

                    const tickerBar = document.getElementById('ticker-bar');
                    const tickerContent = document.getElementById('ticker-content');
                    
                    if (activeMessages.length > 0) {
                        const fullText = activeMessages.join('   +++   ');
                        tickerContent.textContent = fullText;
                        
                        if (!tickerContent.classList.contains('animate-marquee')) {
                             tickerContent.classList.add('animate-marquee');
                        }

                        const estimatedTextWidth = fullText.length * 25; 
                        const totalDistance = window.innerWidth + estimatedTextWidth;
                        const speedPixelsPerSecond = 150; 
                        const duration = totalDistance / speedPixelsPerSecond;

                        tickerContent.style.animationDuration = `${duration}s`;

                        tickerBar.classList.remove('hidden');
                        tickerBar.classList.add('flex');
                    } else {
                        tickerBar.classList.add('hidden');
                        tickerBar.classList.remove('flex');
                        tickerContent.classList.remove('animate-marquee');
                    }
                };

                checkTicker();

                if (tickerInterval) clearInterval(tickerInterval);
                tickerInterval = setInterval(checkTicker, 60000); 
            });
        }

        let audioEnabled = true; 
        const alertAudioElement = document.getElementById('alertSound');
        const audioNotice = document.getElementById('audioNotice');
        const audioNoticeText = document.getElementById('audioNoticeText');
        const enableAudioButton = document.getElementById('enableAudioButton');
        const toneFileMap = {
            'default': 'sounds/default.mp3', 'alarm': 'sounds/alarm.mp3',
            'chime': 'sounds/chime.mp3', 'ascending': 'sounds/chime.mp3'
        };

        function hideAudioNotice() {
            audioNotice.classList.add('hidden');
            audioNotice.classList.remove('flex');
        }

        function showAudioNotice(message, canEnable = false) {
            audioNoticeText.textContent = message;
            enableAudioButton.classList.toggle('hidden', !canEnable);
            audioNotice.classList.remove('hidden');
            audioNotice.classList.add('flex');
        }

        enableAudioButton.addEventListener('click', async () => {
            try {
                alertAudioElement.currentTime = 0;
                await alertAudioElement.play();
                hideAudioNotice();
            } catch (error) {
                console.error('Unable to enable alert audio:', error);
                showAudioNotice('Unable to play the configured alert sound.', false);
            }
        });

        function playAlertSound(toneName = 'default') {
            if (!audioEnabled) {
              console.warn("Audio not enabled.");
              return;
            }
            const fileName = toneFileMap[toneName] || `sounds/${toneName}`; 
            alertAudioElement.src = fileName;
            alertAudioElement.currentTime = 0;
            alertAudioElement.play().catch(error => {
              if (error?.name === 'NotAllowedError') {
                console.warn(`Browser blocked automatic playback of "${fileName}".`);
                showAudioNotice('Browser sound is locked. Select Enable Alert Audio once.', true);
                return;
              }

              console.error(`Unable to load or play sound "${fileName}":`, error);
              showAudioNotice(`Unable to load the configured alert sound: ${fileName}`, false);
            });
        }

        async function fetchNewsFeed() {
            if (!dashboardConfig) return;
            if (typeof Papa === 'undefined') return;
            
            Papa.parse(SHEET_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: (results) => {
                    try {
                        const activePosts = filterActivePosts(results.data);
                        newsFeedPosts = activePosts; 
                        
                        const secondsPerItem = dashboardConfig.newsFeed_secondsPerItem || 20;
                        const totalDurationMs = activePosts.length * secondsPerItem * 1000;
                        
                        newsFeedSlideSource.duration = totalDurationMs > 0 ? totalDurationMs : 60000; 
                    } catch (error) {
                        newsFeedPosts = []; 
                        newsFeedSlideSource.duration = 60000; 
                    }
                },
                error: (err) => {
                    newsFeedPosts = []; 
                    newsFeedSlideSource.duration = 60000; 
                }
            });
        }
        
        function filterActivePosts(posts) {
            if (typeof dayjs === 'undefined') return [];
            const now = dayjs();
            
            return posts.filter((post, index) => {
                const title = post['Title *'];
                const postDateStr = post['Date/Time to Post'];
                const removeDateStr = post['Date to Remove'];

                if (!title) return false;
                if (!postDateStr) return false;

                const postDate = dayjs(postDateStr);
                if (!postDate.isValid()) return false;
                
                if (!now.isAfter(postDate)) return false;
                
                if (removeDateStr) {
                    const removeDate = dayjs(removeDateStr);
                    if (removeDate.isValid() && now.isAfter(removeDate)) return false;
                }
                return true;
            });
        }

        function renderFeed(posts, feedContainer) {
            if (newsFeedSlideInterval) clearInterval(newsFeedSlideInterval);
            
            if (!feedContainer) return;
            const feedTrack = feedContainer.querySelector('#feed-track');
            if (!feedTrack) return;
            feedTrack.innerHTML = ''; 

            if (posts.length === 0) {
                feedContainer.innerHTML = `
                    <div class="w-full h-full flex flex-col justify-center items-center text-center p-10">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-24 w-24 text-gray-600 mb-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">

            if (!feedContainer) return;
            feedContainer.innerHTML = `
                <div class="w-full h-full flex flex-col justify-center items-center text-center p-10 bg-red-900">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-24 w-24 text-red-300 mb-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                         <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>

                    <p class="text-3xl text-red-200">${escapeHtml(message)}</p>

        function startSlideshow(postCount, feedTrack) {
            if (!feedTrack) return;
            const slides = feedTrack.querySelectorAll('.feed-item');
            if (slides.length === 0) return;

            if (newsFeedSlideInterval) clearInterval(newsFeedSlideInterval); 

            let currentSlideIndex = 0;
            slides[currentSlideIndex].classList.add('active'); 
            slides[currentSlideIndex].classList.remove('fading-out'); 

            if (postCount <= 1) return; 

            let slideIndex = 0; 
            const secondsPerItem = (dashboardConfig && dashboardConfig.newsFeed_secondsPerItem) ? dashboardConfig.newsFeed_secondsPerItem : 20;

            newsFeedSlideInterval = setInterval(() => {
                if (slideIndex < postCount - 1) {
                    slides[slideIndex].classList.add('fading-out'); 
                    slides[slideIndex].classList.remove('active'); 
                    slideIndex++;
                    slides[slideIndex].classList.add('active'); 
                    slides[slideIndex].classList.remove('fading-out'); 
                } else {
                    clearInterval(newsFeedSlideInterval);
                    newsFeedSlideInterval = null;
                }
            }, secondsPerItem * 1000);
        }

        async function setupGoogleSlides() {
            if (!dashboardConfig) return;

            const slidesConfig = dashboardConfig; 
            const slidesSource = slideSources.find(s => s.type === 'googleslides');

            const scriptUrl = safeHttpsUrl(slidesConfig.googleSlides_scriptUrl, ['script.google.com', 'script.googleusercontent.com']);
            const embedBaseUrl = safeHttpsUrl(slidesConfig.googleSlides_embedUrlBase, ['docs.google.com']);

            if (!scriptUrl || !embedBaseUrl || !slidesSource) {
                if(slidesSource) {
                    slidesSource.iframe = `<div class="w-full h-full flex items-center justify-center bg-gray-800 text-yellow-300 p-8 text-center text-2xl"><strong>Configuration Needed:</strong><br>Please set your Google Slides Apps Script URL in the <strong>Admin Console</strong>.</div>`;
                    slidesSource.duration = 20000;
                }
                return;
            }

            try {
                const response = await fetch(scriptUrl, { cache: 'no-cache' });
                if (!response.ok) throw new Error(`Failed to fetch slide count. Status: ${response.status}.`);
                
                const slideCount = parseInt(await response.text(), 10);
                if (isNaN(slideCount) || slideCount <= 0) throw new Error(`Invalid slide count received: ${slideCount}`);

                const delayMs = finiteNumber(slidesConfig.googleSlides_delayPerSlideSeconds, 20, 1, 300) * 1000;
                const totalDuration = slideCount * delayMs;
                if (delayMs <= 0) {
                    slidesSource.duration = 20000; 
                } else {
                    slidesSource.duration = totalDuration;
                }
                
                const separator = embedBaseUrl.includes('?') ? '&' : '?';
                const embedUrl = `${embedBaseUrl}${separator}delayms=${delayMs}`;
                const iframeHtml = safeIframeMarkup(embedUrl, 'Google Slides');

                slidesSource.iframe = iframeHtml;

            } catch (error) {
                if(slidesSource){
                    slidesSource.iframe = `<div class="w-full h-full flex items-center justify-center bg-gray-800 text-red-400 p-8 text-center text-2xl"><strong>Error:</strong><br>Could not load Google Slides count.<br>${escapeHtml(error.message)}</div>`;
                    slidesSource.duration = 20000;
                }
            }
        }

        function scheduleNextSlide(duration) { 
            if (slideRotationTimer) clearTimeout(slideRotationTimer);
            slideRotationTimer = setTimeout(() => { 
                contentIndex = (contentIndex + 1) % slideSources.length; 
                rotateSlides(); 
            }, duration); 
        }

        function rotateSlides() {
            if (slideSources.length === 0) return;
            if (contentIndex >= slideSources.length) contentIndex = 0;

            let source = slideSources[contentIndex];
            const initialIndex = contentIndex;
            
            while (source.duration === 0) {
                contentIndex = (contentIndex + 1) % slideSources.length;
                source = slideSources[contentIndex];
                if (contentIndex === initialIndex) return; 
            }

            const nextSlideIndex = 1 - activeSlideIndex;
            const currentSlide = slideDivs[activeSlideIndex];
            const nextSlide = slideDivs[nextSlideIndex];
            
            nextSlide.innerHTML = source.iframe;

            if (source.type === 'newsfeed') {
                if (newsFeedSlideInterval) clearInterval(newsFeedSlideInterval); 
                const feedContainer = nextSlide.querySelector('#feed-container');
                if (feedContainer) {
                    renderFeed(newsFeedPosts, feedContainer); 
                } else {
                    nextSlide.innerHTML = `<div class="w-full h-full flex items-center justify-center bg-red-800 text-white p-4">News Feed Error: Could not find #feed-container.</div>`;
                }
            } else {
                if (newsFeedSlideInterval) {
                    clearInterval(newsFeedSlideInterval);
                    newsFeedSlideInterval = null;
                }
            }

            const iframe = nextSlide.querySelector('iframe');
            
            const transition = () => {
                if (nextSlide.classList.contains('opacity-100')) return;
                currentSlide.classList.remove('opacity-100');
                currentSlide.classList.add('opacity-0');
                nextSlide.classList.remove('opacity-0');
                nextSlide.classList.add('opacity-100');
                activeSlideIndex = nextSlideIndex;
                scheduleNextSlide(source.duration);
            };

            if (iframe) {
                let loaded = false;
                const loadTimeout = setTimeout(() => {
                    if (!loaded) transition();
                }, 5000); 

                iframe.onload = () => { loaded = true; clearTimeout(loadTimeout); transition(); };
                iframe.onerror = () => {
                    loaded = true; clearTimeout(loadTimeout);
                    nextSlide.innerHTML = `<div class="w-full h-full flex items-center justify-center bg-gray-800 text-red-400 p-8 text-center text-2xl"><strong>Error:</strong><br>Could not load slide content.</div>`;
                    transition();
                };
            } else {
                transition();
            }
        }

        async function startRotation() {
            if (slideRotationTimer) clearTimeout(slideRotationTimer);
            
            await setupGoogleSlides(); 
            
            if (slideSources.length === 0) {
                slideDivs[0].innerHTML = `<div class="w-full h-full flex items-center justify-center bg-gray-800 text-yellow-300 p-8 text-center text-2xl">No slides configured. Please add slides in the admin console.</div>`;
                slideDivs[0].classList.remove('opacity-0');
                slideDivs[0].classList.add('opacity-100');
                return;
            }

            contentIndex = 0;
            let firstSource = slideSources[contentIndex];
            const initialIndex = contentIndex;
            while (firstSource.duration === 0) {
                contentIndex = (contentIndex + 1) % slideSources.length;
                firstSource = slideSources[contentIndex];
                if (contentIndex === initialIndex) { 
                    slideDivs[0].innerHTML = `<div class="w-full h-full flex items-center justify-center bg-gray-800 text-yellow-300 p-8 text-center text-2xl">All slides are currently disabled (duration 0).</div>`;
                    slideDivs[0].classList.add('opacity-100');
                    return; 
                }
            }
            
            slideDivs[0].innerHTML = firstSource.iframe;
            if (firstSource.type === 'newsfeed') {
                if (newsFeedSlideInterval) clearInterval(newsFeedSlideInterval);
                const feedContainer = slideDivs[0].querySelector('#feed-container');
                if (feedContainer) {
                    renderFeed(newsFeedPosts, feedContainer);
                }
            }

            slideDivs[1].innerHTML = '';
            slideDivs[1].classList.remove('opacity-100');
            slideDivs[1].classList.add('opacity-0');
            
            const transition = () => {
                if (slideDivs[0].classList.contains('opacity-100')) return;
                slideDivs[0].classList.remove('opacity-0');
                slideDivs[0].classList.add('opacity-100');
                activeSlideIndex = 0;
                scheduleNextSlide(firstSource.duration);
            };
            
            const firstIframe = slideDivs[0].querySelector('iframe');
            if(firstIframe) {
                let loaded = false;
                const loadTimeout = setTimeout(() => {
                    if (!loaded) transition();
                }, 5000);
                firstIframe.onload = () => { loaded = true; clearTimeout(loadTimeout); transition(); };
                firstIframe.onerror = () => { loaded = true; clearTimeout(loadTimeout); transition(); };
            } else {
                transition();
            }
        }

        function showIPAWSAlert(message, duration, toneName = 'default') {
          const overlay = document.getElementById("ipawsAlertOverlay");
          overlay.innerHTML = message;
          overlay.classList.remove('invisible', 'opacity-0');
          overlay.classList.add('opacity-100');
          playAlertSound(toneName);
          setTimeout(() => {
            overlay.classList.remove('opacity-100');
            overlay.classList.add('invisible', 'opacity-0');
          }, duration);
        }

        function showDispatchModal(data, durationMs) {
            const overlay = document.getElementById("dispatchAlertOverlay");
            
            let translatedNarrative = data.narrative || 'DISPATCH';
            let translatedCallType = data.callType || 'See CAD for details';

            // Apply custom translations from config if available
            if (dashboardConfig && dashboardConfig.translations) {
                dashboardConfig.translations.forEach(t => {
                    if (translatedNarrative.toLowerCase().trim() === t.original.toLowerCase().trim()) {
                        translatedNarrative = t.replacement;
                    }
                    if (translatedCallType.toLowerCase().trim() === t.original.toLowerCase().trim()) {
                        translatedCallType = t.replacement;
                    }
                });
            }

            document.getElementById("run-type").textContent = translatedNarrative;
            
            document.getElementById("run-dispatch").textContent = data.dispatch || 'N/A';
            
            const runLocation = document.getElementById("run-location");
            runLocation.textContent = data.location || 'LOCATION UNKNOWN';
            
            document.getElementById("run-city").textContent = data.city || '';
            document.getElementById("run-location-info").textContent = data.locationInfo || '';
            
            document.getElementById("run-narrative").textContent = translatedCallType;
            
            const suppEl = document.getElementById("run-supplemental");
            if (Array.isArray(data.supplemental)) {
                suppEl.innerHTML = data.supplemental.map(escapeHtml).join('<br><br>');
            } else {
                suppEl.textContent = data.supplemental || '';
            }

            document.getElementById("run-incident").textContent = data.incidentId ? `Inc: ${data.incidentId}` : '';
            
            if (data.timestamp && typeof dayjs !== 'undefined') {
                document.getElementById("run-timestamp").textContent = dayjs(data.timestamp).format('MM/DD/YYYY HH:mm:ss');
            } else {
                document.getElementById("run-timestamp").textContent = data.timestamp || '';
            }

            // 1. MAKE MODAL VISIBLE FIRST (So the browser can measure it)
            overlay.classList.remove('hidden', 'opacity-0');
            overlay.classList.add('flex', 'opacity-100');
            
            // 2. NOW AUTO-SCALE THE FONT
            runLocation.style.fontSize = ''; // Reset to default size first
            let currentSize = parseInt(window.getComputedStyle(runLocation).fontSize);
            while (runLocation.scrollWidth > runLocation.clientWidth && currentSize > 10) {
                currentSize -= 1;
                runLocation.style.fontSize = currentSize + 'px';
            }
            
            playAlertSound('default'); 

            setTimeout(() => {
                overlay.classList.remove('opacity-100');
                overlay.classList.add('opacity-0');
                setTimeout(() => {
                    overlay.classList.remove('flex');
                    overlay.classList.add('hidden');
                }, 500); 
            }, durationMs);
        }

        function initializeDispatchListener() {
            const dispatchDocRef = doc(db, 'alerts', 'active_run');

            onSnapshot(dispatchDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    const runData = docSnap.data();
                    const eventTimestamp = runData.timestamp || runData.createdAt;
                    const eventKey = `${runData.incidentId || ''}:${eventTimestamp || ''}`;
                    if (!isFreshEvent(eventTimestamp, 15 * 60 * 1000) || sessionStorage.getItem('stfd-last-dispatch') === eventKey) return;
                    sessionStorage.setItem('stfd-last-dispatch', eventKey);

                    const durationMs = (dashboardConfig && dashboardConfig.dispatchAlertDurationSeconds) 
                        ? finiteNumber(dashboardConfig.dispatchAlertDurationSeconds, 120, 10, 600) * 1000
                        : 120000;

                    showDispatchModal(runData, durationMs);
                }
            }, (error) => {
                console.error('Dispatch listener failed:', error);
                setSystemStatus('Dispatch connection unavailable');
            });
        }

        async function fetchIPAWSAlerts() {
          if (!dashboardConfig || !dashboardConfig.nwsAlertZone) return;
          try {
            const response = await fetch(`https://api.weather.gov/alerts/active/zone/${dashboardConfig.nwsAlertZone}`, {
                headers: {
                    'Accept': 'application/geo+json',
                    'User-Agent': '(STFD Dashboard)'
                }
            });

            if (!response.ok) { throw new Error(`HTTP error! status: ${response.status}`); }
            const data = await response.json();
            
            const sidebarAlert = document.getElementById('sidebar-alert-display');
            if (sidebarAlert) {
                if (data.features && data.features.length > 0) {
                    const events = [...new Set(data.features.map(f => f.properties.event))];
                    const alertHtml = events.map(escapeHtml).join('<br>');
                    
                    sidebarAlert.innerHTML = `
                        <div class="bg-red-600 text-white rounded-lg p-3 animate-pulse border-2 border-red-400 shadow-lg text-center">
                            <div class="flex justify-center mb-1">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-yellow-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                                </svg>
                            </div>
                            <p class="text-sm font-black uppercase tracking-wide leading-tight">${alertHtml}</p>
                        </div>
                    `;
                    sidebarAlert.classList.remove('hidden');
                } else {
                    sidebarAlert.classList.add('hidden');
                    sidebarAlert.innerHTML = '';
                }
            }

            const newAlertMessages = [];
            if (data.features && data.features.length > 0) {
              for (const feature of data.features) {
                const alertId = feature.id;
                if (!shownAlerts.has(alertId)) {
                  newAlertMessages.push(feature.properties.headline);
                  shownAlerts.add(alertId);
                }
              }
            }
            if (newAlertMessages.length > 0) {
              const fullMessage = newAlertMessages.map(escapeHtml).join(' <span class="text-gray-500 mx-4">|||</span> ');
              const displayDuration = 60000 * newAlertMessages.length;
              showIPAWSAlert(fullMessage, displayDuration, 'alarm');
            }
          } catch (error) {
            console.warn('Weather alert refresh failed:', error);
            setSystemStatus('Some live services are temporarily unavailable');
          }
        }
        
        const WEATHER_ICONS = {
            'Sunny': `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`,

            'Snow': `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A5B4FC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 17.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"></path><line x1="8" y1="15" x2="8" y2="15"></line><line x1="8" y1="19" x2="8" y2="19"></line><line x1="12" y1="17" x2="12" y2="17"></line><line x1="12" y1="21" x2="12" y2="21"></line><line x1="16" y1="15" x2="16" y2="15"></line><line x1="16" y1="19" x2="16" y2="19"></line></svg>`
        };

        function getWeatherIcon(desc, classes = 'w-full h-full') {
            let iconKey = 'Cloudy'; 
            if (!desc) return WEATHER_ICONS[iconKey].replace('width="24" height="24"', `class="${classes}"`);

            const description = desc.toLowerCase();
            
            if (description.includes('sunny') || description.includes('clear')) iconKey = 'Sunny';
            else if (description.includes('partly cloudy') || description.includes('mostly sunny')) iconKey = 'Partly Cloudy';
            else if (description.includes('cloudy') || description.includes('mostly cloudy')) iconKey = 'Cloudy';
            else if (description.includes('rain') || description.includes('shower')) iconKey = 'Rain';
            else if (description.includes('snow')) iconKey = 'Snow';
            
            if (WEATHER_ICONS[iconKey]) {
                 return WEATHER_ICONS[iconKey].replace('width="24" height="24"', `class="${classes}"`);
            } else {
                 return WEATHER_ICONS['Cloudy'].replace('width="24" height="24"', `class="${classes}"`);
            }
        }

        async function fetchToolbarWeather() {
            if (!dashboardConfig || !dashboardConfig.weather_latitude) return;

            const weather = dashboardConfig; 
            const userAgent = '(STFD Dashboard)';

            const tempEl = document.getElementById('weather-temp');
            const conditionEl = document.getElementById('weather-condition');
            const highLowEl = document.getElementById('weather-high-low');
            const locationEl = document.getElementById('weather-location');
            const iconContainer = document.getElementById('weather-icon-container');

            try {
                const pointsUrl = `https://api.weather.gov/points/${weather.weather_latitude},${weather.weather_longitude}`;
                const pointsResponse = await fetch(pointsUrl, { headers: { 'User-Agent': userAgent } });
                
                if (!pointsResponse.ok) throw new Error(`Points API Error: ${pointsResponse.status}`);
                const pointsData = await pointsResponse.json();

                const forecastUrl = pointsData.properties.forecast;
                const hourlyUrl = pointsData.properties.forecastHourly;
                const city = pointsData.properties.relativeLocation.properties.city;

                const [forecastResponse, hourlyResponse] = await Promise.all([
                    fetch(forecastUrl, { headers: { 'User-Agent': userAgent } }),
                    fetch(hourlyUrl, { headers: { 'User-Agent': userAgent } })
                ]);

                if (!forecastResponse.ok) throw new Error("Daily Forecast API Error");
                if (!hourlyResponse.ok) throw new Error("Hourly Forecast API Error");

                const forecastData = await forecastResponse.json();
                const hourlyData = await hourlyResponse.json();

                const currentPeriod = hourlyData.properties.periods[0];
                const temp = currentPeriod.temperature;
                const description = currentPeriod.shortForecast;
                const iconSvg = getWeatherIcon(description, 'w-16 h-16'); 

                let periods = forecastData.properties.periods;
                let startIndex = periods[0].isDaytime ? 0 : 1;
                
                let high = '--';
                let low = '--';

                if (periods.length > startIndex + 1) {
                    const day = periods[startIndex];
                    const night = periods[startIndex + 1];
                    high = day.temperature;
                    low = night.temperature;
                }

                tempEl.textContent = `${temp}°`;
                conditionEl.textContent = description;
                locationEl.textContent = city || weather.weather_locationName; 
                highLowEl.textContent = `H: ${high}° L: ${low}°`;
                iconContainer.innerHTML = iconSvg; 

            } catch (error) {
                conditionEl.textContent = 'Weather unavailable';
                tempEl.textContent = '--°';
                highLowEl.textContent = 'H: --° L: --°';
                iconContainer.innerHTML = `<div class="text-yellow-400 text-6xl" role="img" aria-label="Weather unavailable">⚠</div>`;
            }
        }

        function initializeConfigListener() {
            const configDocRef = doc(db, 'config', 'global');
            let firstConfigLoad = true; 

            onSnapshot(configDocRef, async (docSnap) => {
                if (docSnap.exists()) {
                    dashboardConfig = docSnap.data();

                    const logoImg = document.getElementById('dashboard-logo');
                    const logoUrl = safeHttpsUrl(dashboardConfig.logoUrl);
                    if (logoUrl) {
                        logoImg.src = logoUrl;
                        logoImg.style.display = 'block'; 
                    } else {
                        logoImg.style.display = 'none';
                    }

                    if (ipawsInterval) clearInterval(ipawsInterval);
                    if (weatherInterval) clearInterval(weatherInterval);
                    if (slidesRefreshInterval) clearInterval(slidesRefreshInterval);

                    fetchIPAWSAlerts();
                    fetchToolbarWeather();
                    
                    if (firstConfigLoad) {
                        initializeAlertListener(); 
                        initializeDispatchListener();
                        initializeSlideListener(); 
                        initializeForceReloadListener(); 
                        
                        initializeTicker(); 
                        fetchNewsFeed(); 
                        setInterval(fetchNewsFeed, REFRESH_INTERVAL_MS); 

                        firstConfigLoad = false;
                    } else {
                        await setupGoogleSlides();
                        fetchNewsFeed(); 
                    }

                    const ipawsRefreshMs = finiteNumber(dashboardConfig.nwsAlertRefreshSeconds, 300, 60, 3600) * 1000;
                    ipawsInterval = setInterval(fetchIPAWSAlerts, ipawsRefreshMs);
                    
                    const weatherRefreshMs = finiteNumber(dashboardConfig.weather_refreshIntervalMinutes, 10, 1, 180) * 60 * 1000;
                    weatherInterval = setInterval(fetchToolbarWeather, weatherRefreshMs);

                    if (dashboardConfig.googleSlides_refreshIntervalMinutes > 0) {
                        const slidesRefreshMs = finiteNumber(dashboardConfig.googleSlides_refreshIntervalMinutes, 10, 1, 180) * 60 * 1000;
                        slidesRefreshInterval = setInterval(async () => {
                            await setupGoogleSlides();
                        }, slidesRefreshMs);
                    }
                } else {
                    slideDivs[0].innerHTML = `<div class="w-full h-full flex items-center justify-center bg-red-900 text-white p-8 text-center text-3xl"><strong>FATAL ERROR:</strong><br>Global configuration not found in database. Please set it in the admin console.</div>`;
                    slideDivs[0].classList.add('opacity-100');
                    document.getElementById('dashboard-logo').style.display = 'none';
                }
            }, (error) => { 
                slideDivs[0].innerHTML = `<div class="w-full h-full flex items-center justify-center bg-red-900 text-white p-8 text-center text-3xl"><strong>FATAL ERROR:</strong><br>Connection to configuration lost. Please refresh.<br>${escapeHtml(error.message)}</div>`;
                slideDivs[0].classList.add('opacity-100');
                document.getElementById('dashboard-logo').style.display = 'none';
                
                if (ipawsInterval) clearInterval(ipawsInterval);
                if (weatherInterval) clearInterval(weatherInterval);
                if (slidesRefreshInterval) clearInterval(slidesRefreshInterval);
                setSystemStatus('Dashboard configuration connection lost');
            });
        }

        function initializeAlertListener() {
            const alertDocRef = doc(db, 'alerts', 'manual_alert');

            onSnapshot(alertDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    const alertData = docSnap.data();
                    const eventTimestamp = alertData.timestamp || alertData.createdAt;
                    const eventKey = `${eventTimestamp || ''}:${alertData.title || ''}:${alertData.message || ''}`;
                    if (alertData && alertData.message && alertData.duration &&
                        isFreshEvent(eventTimestamp, 10 * 60 * 1000) &&
                        sessionStorage.getItem('stfd-last-manual-alert') !== eventKey) {
                        sessionStorage.setItem('stfd-last-manual-alert', eventKey);
                        let displayMessage = alertData.title ? 
                            `<div class="text-center"><h1 class="text-6xl md:text-7xl font-black mb-4">${escapeHtml(alertData.title)}</h1><p class="text-4xl md:text-5xl font-bold">${escapeHtml(alertData.message)}</p></div>` : 
                            escapeHtml(alertData.message);
                        showIPAWSAlert(displayMessage, finiteNumber(alertData.duration, 15000, 3000, 300000), alertData.tone || 'default');
                    }
                }
            }, (error) => {
                console.error('Manual alert listener failed:', error);
                setSystemStatus('Manual alert connection unavailable');
            });
        }

        function initializeForceReloadListener() {
            const forceReloadDocRef = doc(db, 'alerts', 'force_reload');

            onSnapshot(forceReloadDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    const reloadData = docSnap.data();
                    const eventTimestamp = reloadData.timestamp || reloadData.createdAt;
                    const eventKey = String(eventTimestamp || '');
                    if (!isFreshEvent(eventTimestamp, 5 * 60 * 1000) || sessionStorage.getItem('stfd-last-reload') === eventKey) return;
                    sessionStorage.setItem('stfd-last-reload', eventKey);
                    window.location.reload();
                }
            }, (error) => {
                console.error('Force reload listener failed:', error);
                setSystemStatus('Remote reload connection unavailable');
            });
        }

        function initializeSlideListener() {
            const slidesQuery = query(collection(db, 'slides'), orderBy('order'));
            onSnapshot(slidesQuery, (snapshot) => {
                const newSlideSources = [googleSlideSource, newsFeedSlideSource]; 
                
                snapshot.docs.forEach(doc => {
                    const data = doc.data();
                    if (data.iframe && data.duration > 0) {
                        const iframe = safeIframeMarkup(data.iframe, data.title || 'Dashboard slide');
                        if (iframe) {
                            newSlideSources.push({
                                ...data,
                                iframe,
                                duration: finiteNumber(data.duration, 20000, 5000, 60 * 60 * 1000),
                                order: finiteNumber(data.order, 99, 0, 999)
                            });
                        }
                    }
                });

                newSlideSources.sort((a, b) => (a.order || 99) - (b.order || 99));

                slideSources = newSlideSources; 
                startRotation(); 
            }, (error) => {
                slideSources = [googleSlideSource, newsFeedSlideSource].sort((a, b) => a.order - b.order);
                startRotation();
            });
        }
        
        function initializeFirebase() {
            try {
                if (!firebaseConfig || firebaseConfig.apiKey.startsWith("PASTE_")) {
                    throw new Error('Firebase configuration is missing.');
                }
                
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);

                initializeConfigListener();
            } catch(error) {
                console.error('Firebase initialization failed:', error);
                setSystemStatus('Dashboard data connection failed');
                slideDivs[0].innerHTML = `<div class="w-full h-full flex items-center justify-center bg-red-900 text-white p-8 text-center text-3xl"><strong>CONNECTION ERROR</strong><br>${escapeHtml(error.message)}</div>`;
                slideDivs[0].classList.add('opacity-100');
            }
        }

        initializeFirebase();
    });
  </script>

</body>
