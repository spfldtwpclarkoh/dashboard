<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#070b10">
    <meta name="description" content="Staffing schedule two days ahead for Stations 58 and 72.">
    <title>Two Days Ahead · Station Staffing Board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="schedule.css">
    <script src="schedule.js" defer></script>
</head>
<body data-day-offset="2" data-page-label="Two Days Ahead">
    <main class="dashboard">
        <header class="topbar">
            <div class="page-heading">
                <p class="eyebrow">STFD · Staffing board</p>
                <h1>Two days ahead <span id="date-label" class="date-label">Loading date…</span></h1>
            </div>
            <div id="sync-card" class="sync-card" data-state="loading" role="status" aria-live="polite">
                <p class="sync-state"><span class="status-dot" aria-hidden="true"></span><span id="sync-label">Connecting to schedule</span></p>
                <p id="sync-detail" class="sync-detail">Loading staffing data</p>
            </div>
        </header>

        <div class="station-grid">
            <section class="station-panel" data-station="58" data-alert="false" aria-labelledby="station-58-title">
                <header class="station-header">
                    <div class="station-heading">
                        <div class="station-number" aria-hidden="true">58</div>
                        <div><h2 id="station-58-title" class="station-title">Station 58</h2><p class="station-requirement">Minimum staffing · 3</p></div>
                    </div>
                    <p id="sta58-summary" class="station-summary">Loading…</p>
                </header>
                <div id="sta58-schedule" class="schedule-list" aria-live="polite">
                    <div class="empty-state"><div class="loading-state"><span class="spinner" aria-hidden="true"></span><span>Syncing schedule…</span></div></div>
                </div>
            </section>

            <section class="station-panel" data-station="72" data-alert="false" aria-labelledby="station-72-title">
                <header class="station-header">
                    <div class="station-heading">
                        <div class="station-number" aria-hidden="true">72</div>
                        <div><h2 id="station-72-title" class="station-title">Station 72</h2><p class="station-requirement">Minimum staffing · 2</p></div>
                    </div>
                    <p id="sta72-summary" class="station-summary">Loading…</p>
                </header>
                <div id="sta72-schedule" class="schedule-list" aria-live="polite">
                    <div class="empty-state"><div class="loading-state"><span class="spinner" aria-hidden="true"></span><span>Syncing schedule…</span></div></div>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
